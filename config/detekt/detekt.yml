complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']
    ignoreDefaultParameters: true
  TooManyFunctions:
    # Private helpers are how LongMethod gets fixed; counting them would set the two rules against each other.
    ignorePrivate: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
  ReturnCount:
    excludeGuardClauses: true
  MaxLineLength:
    # ktlint's default; Spotless joins lines up to this length
    maxLineLength: 140
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  WildcardImport:
    active: false
  NewLineAtEndOfFile:
    active: false
