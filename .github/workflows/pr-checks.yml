name: PR checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
    name: Build, test, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Compile
        run: ./gradlew compileKotlinJvm compileAndroidMain :androidApp:compileDebugKotlin --continue

      - name: Unit tests and coverage
        run: ./gradlew jvmTest koverXmlReport koverHtmlReport --continue

      - name: Architecture rules
        if: always()
        run: ./gradlew :konsist-test:test

      - name: Coverage summary
        if: always()
        run: |
          report=build/reports/kover/report.xml
          if [ -f "$report" ]; then
            python3 - "$report" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          print("### Coverage\n\n| Counter | Covered | Total | % |\n|---|---|---|---|")
          for c in root.findall("counter"):
              covered, missed = int(c.get("covered")), int(c.get("missed"))
              total = covered + missed
              pct = 100.0 * covered / total if total else 0.0
              print(f"| {c.get('type').title()} | {covered} | {total} | {pct:.1f} |")
          EOF
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            build/reports/kover/
          if-no-files-found: ignore

  stability:
    name: Compose stability
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Compile
        run: ./gradlew compileKotlinJvm compileAndroidMain

      - name: Stability check
        run: ./gradlew stabilityCheck --continue

  static:
    name: Spotless and detekt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Spotless
        run: ./gradlew spotlessCheck

      - name: detekt
        if: always()
        run: ./gradlew detekt --continue

      - name: Merge detekt SARIF
        if: always()
        run: python3 .github/scripts/merge_sarif.py '**/build/reports/detekt/detekt.sarif' detekt.sarif

      - name: Upload detekt SARIF
        if: always() && hashFiles('detekt.sarif') != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: detekt.sarif
          category: detekt

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/'
          if-no-files-found: ignore

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Android Lint
        run: ./gradlew lintDebug lintAndroidMain --continue

      - name: Merge lint SARIF
        if: always()
        run: python3 .github/scripts/merge_sarif.py '**/build/reports/lint-results-*.sarif' lint.sarif

      - name: Upload lint SARIF
        if: always() && hashFiles('lint.sarif') != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: lint.sarif
          category: android-lint

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.*'
          if-no-files-found: ignore

  agent-config:
    name: Agent config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: agnix
        uses: agent-sh/agnix@cc559089a2e5fec8b84229c810827ff8d4685a22 # v0.59.0
        with:
          target: claude-code
          version: v0.59.0
