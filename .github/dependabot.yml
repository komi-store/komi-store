version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # Newer releases need compileSdk 37 (AndroidX Compose 1.12, lifecycle 2.11, OkHttp 5.5); lift with the compileSdk 37 upgrade. Patches still come through.
      - dependency-name: "org.jetbrains.androidx.lifecycle:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "io.ktor:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "io.coil-kt.coil3:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "com.mikepenz:multiplatform-markdown-renderer*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "io.github.iamr0s:Dhizuku-API"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Kermit 2.2 deprecates the tag-first log overloads used across the codebase, and warnings are errors; lift with the logging cleanup (D7 in docs/quality/findings.md).
      - dependency-name: "co.touchlab:kermit*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Held for steps 6-7 of the AGP 9 migration, which bring this group at pinned versions; lift then.
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "com.google.devtools.ksp*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "*compose.stability*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "com.github.skydoves:compose-stability*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.jetbrains.compose*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "com.codingfeline.buildkonfig*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "*compose.stability*"
          - "com.github.skydoves:compose-stability*"
          - "org.jetbrains.compose*"
          - "com.codingfeline.buildkonfig*"
      gradle-minor-and-patch:
        update-types:
          - minor
          - patch
        # Kotlin-coupled libraries move only with the kotlin-toolchain group; #1078 bundled Kotlin 2.4 here and broke build-logic.
        exclude-patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "*compose.stability*"
          - "com.github.skydoves:compose-stability*"
          - "org.jetbrains.compose*"
          - "com.codingfeline.buildkonfig*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
