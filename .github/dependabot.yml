version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # AGP 8.x uses a Gradle internal API removed in 9.6; lift this with the AGP 9 upgrade.
      - dependency-name: gradle-wrapper
        versions: ["[9.6,)"]
    groups:
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "*compose.stability*"
          - "com.github.skydoves:compose-stability*"
      gradle-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
