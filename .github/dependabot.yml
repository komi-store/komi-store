version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # Kermit 2.2 deprecates the tag-first log overloads used across the codebase, and warnings are errors; lift with the logging cleanup (D7 in docs/quality/findings.md).
      - dependency-name: "co.touchlab:kermit*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Held for step 7 of the AGP 9 migration, which brings Compose Multiplatform 1.12 at a pinned version; lift then.
      - dependency-name: "org.jetbrains.compose*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "*compose.stability*"
          - "com.github.skydoves:compose-stability*"
          - "org.jetbrains.compose*"
          - "com.codingfeline.buildkonfig*"
      gradle-minor-and-patch:
        update-types:
          - minor
          - patch
        # Kotlin-coupled libraries move only with the kotlin-toolchain group; #1078 bundled Kotlin 2.4 here and broke build-logic.
        exclude-patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "*compose.stability*"
          - "com.github.skydoves:compose-stability*"
          - "org.jetbrains.compose*"
          - "com.codingfeline.buildkonfig*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
