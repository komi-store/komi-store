#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

#Android
# AGP 9 enables built-in Kotlin by default, which refuses the KMP plugin together with
# com.android.application/library. Keep the KGP-based Kotlin setup until the KMP modules are
# migrated to com.android.kotlin.multiplatform.library and the new DSL.
android.builtInKotlin=false
android.newDsl=false
android.nonTransitiveRClass=true
android.useAndroidX=true

compose.desktop.packaging.checkJdkVendor=false